{% extends 'base.html' %}  

{% block content %}        

<div class="page-header mb-3">

    <div class="row align-items-center">

        <div class="col">

            <div class="page-pretitle">
                회원 관리
            </div>

            <h2 class="page-title">
                회원 목록
            </h2>

        </div>

        <div class="col-auto ms-auto">

            <a
                href="{% url 'member_create' %}"
                class="btn btn-primary"
            >
                새 회원 등록
            </a>

        </div>

    </div>

</div>
    
    <a href="{% url 'member_create' %}" class="btn btn-primary mb-3">
        새 회원 등록하기
    </a>

    <!-- 부트스트랩 디자인이 적용된 예쁜 테이블 스타일 -->
    <div class="card">
    <div class="table-responsive">
        <table class="table table-vcenter card-table">
        <thead class="table-dark">
            <tr>
                <th>회원 ID</th>
                <th>이름</th>
                <th>이메일</th>
                <th>나이</th>
                <th>가입일</th>
            </tr>
        </thead>
        <tbody>
            {% for member in members %}
            <tr>
                <td>{{ member.id }}</td>
                <td>{{ member.name }}</td>
                <td>{{ member.email }}</td>
                <td>{{ member.age }}</td>
                <td>{{ member.created_at|date:"Y-m-d H:i:s" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">등록된 회원이 없습니다.</td>
            </tr>
            {% endfor %}
        </tbody>
        </table>
    </div>
</div>

{% endblock %}
