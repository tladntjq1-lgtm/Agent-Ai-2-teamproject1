{% extends 'base.html' %}  

{% block content %}        

    <h2 class="mb-4">회원 목록</h2>
    
    <a href="{% url 'member_create' %}">
        <button type="button" class="btn btn-primary mb-3">🆕 새 회원 등록하기</button>
    </a>

    <!-- 부트스트랩 디자인이 적용된 예쁜 테이블 스타일 -->
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>회원 ID</th>
                <th>이름</th>
                <th>이메일</th>
                <th>나이</th>
                <th>가입일</th>
            </tr>
        </thead>
        <tbody>
            {% for member in members %}
            <tr>
                <td>{{ member.id }}</td>
                <td>{{ member.name }}</td>
                <td>{{ member.email }}</td>
                <td>{{ member.age }}</td>
                <td>{{ member.created_at|date:"Y-m-d H:i:s" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">등록된 회원이 없습니다.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
